<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf5ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17131f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dogear">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src *; frame-src blob: data:; worker-src 'self' blob:; form-action 'none';">
<title>Dogear</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<header class="top">
  <div class="brand">
    <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">
      <path class="m-page" d="M16 8h22l10 10v34a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z"/>
      <path class="m-shade" d="M38 8v7a3 3 0 0 0 3 3h7z" opacity="0.18"/>
      <path class="m-fold" d="M38 8v7a3 3 0 0 0 3 3h7z"/>
      <ellipse class="m-eye" cx="25" cy="32" rx="2.5" ry="2.9"/><ellipse class="m-eye" cx="36" cy="32" rx="2.5" ry="2.9"/>
      <circle class="m-glint" cx="25.9" cy="31" r="0.9"/><circle class="m-glint" cx="36.9" cy="31" r="0.9"/>
      <path class="m-smile" d="M25 40.5q5.5 5.5 11 0"/>
      <ellipse class="m-blush" cx="20.2" cy="37.6" rx="2.4" ry="1.5"/><ellipse class="m-blush" cx="40.8" cy="37.6" rx="2.4" ry="1.5"/>
    </svg>
    <div>
      <h1><span class="hl">Dogear</span></h1>
    </div>
  </div>
  <div class="actions">
    <label class="sort-wrap"><span class="visually-hidden">Sort</span>
      <select id="sort" aria-label="Sort shelf">
        <option value="recent">recent</option>
        <option value="title">title</option>
        <option value="author">author</option>
        <option value="added">added</option>
      </select>
    </label>
    <button id="btn-url" class="icon c-blue" aria-label="Add from a link" title="Add from a link">
      <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
    </button>
  </div>
</header>

<main>
  <div id="install-hint" class="hint" hidden>
    <span class="sticker s-sun">psst</span>
    <div><strong>put Dogear on your home screen.</strong> In Safari tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>. Full screen, works offline, no app store.</div>
    <button id="hint-close" class="pill">got it</button>
  </div>

  <section id="continue" class="continue" hidden>
    <p class="eyebrow">keep going <span class="arrow">→</span></p>
    <button id="continue-card" class="continue-card">
      <div class="cc-cover"><img id="cc-img" alt="" hidden><div id="cc-ph" class="ph"></div></div>
      <div class="cc-text">
        <div id="cc-title" class="cc-title"></div>
        <div id="cc-author" class="cc-author"></div>
        <div id="cc-where" class="cc-where"></div>
        <div class="cc-bar"><i id="cc-bar"></i></div>
      </div>
      <span class="cc-go">read</span>
    </button>
  </section>

  <section>
    <p id="shelf-eyebrow" class="eyebrow" hidden>the shelf</p>
    <div id="grid" class="grid"></div>
  </section>

  <div id="empty" class="empty" hidden>
    <svg class="mascot empty-art" viewBox="0 0 64 64" aria-hidden="true">
      <path class="m-page" d="M16 8h22l10 10v34a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z"/>
      <path class="m-shade" d="M38 8v7a3 3 0 0 0 3 3h7z" opacity="0.18"/>
      <path class="m-fold" d="M38 8v7a3 3 0 0 0 3 3h7z"/>
      <ellipse class="m-eye" cx="25" cy="32" rx="2.5" ry="2.9"/><ellipse class="m-eye" cx="36" cy="32" rx="2.5" ry="2.9"/>
      <circle class="m-glint" cx="25.9" cy="31" r="0.9"/><circle class="m-glint" cx="36.9" cy="31" r="0.9"/>
      <path class="m-smile" d="M25 40.5q5.5 5.5 11 0"/>
      <ellipse class="m-blush" cx="20.2" cy="37.6" rx="2.4" ry="1.5"/><ellipse class="m-blush" cx="40.8" cy="37.6" rx="2.4" ry="1.5"/>
    </svg>
    <h2>nothing here yet</h2>
    <p class="muted">tap <strong>add books</strong> to start.</p>
  </div>
  <p id="storage" class="storage"></p>
</main>

<button id="fab" class="fab" aria-label="Add books"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>add books</span></button>
<input id="file-input" type="file" multiple hidden>

<div id="sheet-scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="grab"></div>
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-sub" id="sheet-sub"></div>
  <button class="sheet-btn" data-act="open">open</button>
  <button class="sheet-btn" data-act="details">details</button>
  <button class="sheet-btn danger" data-act="delete">remove from shelf</button>
  <button class="sheet-btn" data-act="cancel">never mind</button>
</div>

<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
